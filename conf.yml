info:
  name: 'Techtyl'
  identifier: 'techtyl'
  description: 'Theme and extension with a live designer, animated backgrounds, server banners and built-in tools for Pterodactyl.'
  flags: ''
  version: '1.0.0'
  target: 'beta-2026-08'
  author: 'theredstonee'
  icon: 'icon.svg'
  website: 'https://github.com/theredstonee/Techtyl'

admin:
  view: 'admin/view.blade.php'
  controller: 'admin/Controller.php'
  css: 'admin/admin.css'
  wrapper: 'admin/wrapper.blade.php'

dashboard:
  css: 'dashboard/dashboard.css'
  wrapper: 'dashboard/wrapper.blade.php'
  components: 'dashboard/components'

data:
  directory: 'data'
  public: 'public'
  console: 'console'

requests:
  views: 'views'
  app: 'app'
  routers:
    application: ''
    client: 'routes/client.php'
    web: 'routes/web.php'

database:
  migrations: 'migrations'
